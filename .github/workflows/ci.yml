name: RAFAY CI

on:
  push:
    branches: [rafay-booking-admin]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Brand audit
        run: npm run check:brand
      - name: Build
        run: npm run build
